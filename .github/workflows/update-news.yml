name: Update Sonhaber

on:
  schedule:
    - cron: "0 * * * *" # Her saat başı (UTC)
  workflow_dispatch: # İstersen Actions sekmesinden elle de tetikleyebilirsin

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Haber çekme / veri üretme adımın buraya gelecek
      # Örnek (Python):
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - name: Fetch news
      #   run: python fetch_news.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: otomatik haber güncellemesi"
            git push
          fi
